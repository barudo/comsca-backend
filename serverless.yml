service: comsca-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-1
  environment:
    APP_STAGE: ${sls:stage}
    DATABASE_URL: ${env:DATABASE_URL}
    SUPABASE_URL: ${env:SUPABASE_URL, ''}
    SUPABASE_PUBLISHABLE_KEY: ${env:SUPABASE_PUBLISHABLE_KEY, ''}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_ROLE_KEY, ''}
    SUPABASE_SMS_HOOK_SECRET: ${env:SUPABASE_SMS_HOOK_SECRET, ''}
    CORS_ALLOWED_ORIGINS: ${env:CORS_ALLOWED_ORIGINS, ''}
    TINDAMATE_TOKEN_HASH_KEY: ${env:TINDAMATE_TOKEN_HASH_KEY, ''}
    TINDAMATE_TOKEN_ENCRYPTION_KEY: ${env:TINDAMATE_TOKEN_ENCRYPTION_KEY, ''}
    TINDAMATE_SIGNING_PRIVATE_KEY: ${env:TINDAMATE_SIGNING_PRIVATE_KEY, ''}
    TINDAMATE_GOOGLE_SECRET_ARN: ${env:TINDAMATE_GOOGLE_SECRET_ARN, ''}
    TINDAMATE_GOOGLE_SECRET_FIELD: ${env:TINDAMATE_GOOGLE_SECRET_FIELD, ''}
    TINDAMATE_PUBSUB_AUDIENCE: ${env:TINDAMATE_PUBSUB_AUDIENCE, ''}
    TINDAMATE_PUBSUB_EMAIL: ${env:TINDAMATE_PUBSUB_EMAIL, ''}
    TINDAMATE_PUBSUB_SUBSCRIPTION: ${env:TINDAMATE_PUBSUB_SUBSCRIPTION, ''}
  timeout: 20

package:
  # Serverless v3 uses `npm ls --prod`, rejected by npm 12, and silently
  # excludes all runtime dependencies. Keep installed dependencies in the ZIP.
  excludeDevDependencies: false
  patterns:
    - '!.env*'
    - '!test/**'
    - '!scripts/**'
    - '!.agents/**'
    - '!_bmad/**'
    - '!_bmad-output/**'
    - '!docs/**'

functions:
  tindamateVoidedSweep:
    handler: src/tindamate-voided-sweep.handler
    timeout: 120
    events:
      - schedule: rate(6 hours)
  api:
    handler: src/handler.handler
    events:
      - httpApi: '*'
      - httpApi:
          method: POST
          path: /api/v1/tindamate/licenses/verify
      - httpApi:
          method: POST
          path: /api/v1/tindamate/licenses/restore
      - httpApi:
          method: POST
          path: /api/v1/tindamate/licenses/v1/google-play/verify
      - httpApi:
          method: POST
          path: /api/v1/tindamate/licenses/reconcile
      - httpApi:
          method: POST
          path: /api/v1/tindamate/licenses/v1/google-play/reconcile
      - httpApi:
          method: POST
          path: /api/v1/tindamate/licenses/rtdn

resources:
  extensions:
    HttpApiStage:
      DependsOn:
        - HttpApiRoutePostApiV1TindamateLicensesVerify
        - HttpApiRoutePostApiV1TindamateLicensesRestore
        - HttpApiRoutePostApiV1TindamateLicensesV1GoogleDashplayVerify
        - HttpApiRoutePostApiV1TindamateLicensesReconcile
        - HttpApiRoutePostApiV1TindamateLicensesV1GoogleDashplayReconcile
        - HttpApiRoutePostApiV1TindamateLicensesRtdn
      Properties:
        RouteSettings:
          "POST /api/v1/tindamate/licenses/verify":
            ThrottlingBurstLimit: 20
            ThrottlingRateLimit: 10
          "POST /api/v1/tindamate/licenses/restore":
            ThrottlingBurstLimit: 20
            ThrottlingRateLimit: 10
          "POST /api/v1/tindamate/licenses/v1/google-play/verify":
            ThrottlingBurstLimit: 20
            ThrottlingRateLimit: 10
          "POST /api/v1/tindamate/licenses/reconcile":
            ThrottlingBurstLimit: 20
            ThrottlingRateLimit: 10
          "POST /api/v1/tindamate/licenses/v1/google-play/reconcile":
            ThrottlingBurstLimit: 20
            ThrottlingRateLimit: 10
          "POST /api/v1/tindamate/licenses/rtdn":
            ThrottlingBurstLimit: 20
            ThrottlingRateLimit: 10
  Conditions:
    HasGoogleSecret:
      Fn::Not:
        - Fn::Equals: ["${env:TINDAMATE_GOOGLE_SECRET_ARN, ''}", '']
    GoogleIsSSM:
      Fn::Equals:
        - Fn::Select:
            - 2
            - Fn::Split:
                - ':'
                - Fn::Join:
                    - ''
                    - ["${env:TINDAMATE_GOOGLE_SECRET_ARN, ''}", ':none:none:none']
        - ssm
    HasSecretsKmsKey:
      Fn::Not:
        - Fn::Equals: ["${env:TINDAMATE_SECRETS_KMS_KEY_ARN, ''}", '']
  Resources:
    TindaMateGoogleSecretPolicy:
      Type: AWS::IAM::Policy
      Condition: HasGoogleSecret
      Properties:
        PolicyName: tindamate-google-secret
        Roles: [{ Ref: IamRoleLambdaExecution }]
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                Fn::If: [GoogleIsSSM, 'ssm:GetParameter', 'secretsmanager:GetSecretValue']
              Resource: "${env:TINDAMATE_GOOGLE_SECRET_ARN, ''}"
    TindaMateSecretsKmsPolicy:
      Type: AWS::IAM::Policy
      Condition: HasSecretsKmsKey
      Properties:
        PolicyName: tindamate-secrets-kms
        Roles: [{ Ref: IamRoleLambdaExecution }]
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "${env:TINDAMATE_SECRETS_KMS_KEY_ARN, ''}"
